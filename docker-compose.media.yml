# Optional: detect physical drives (USB, external disks) mounted while
# mlw-storage runs, and offer them for enabling on the web UI's Drives page.
#
# Enable by adding to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.media.yml
# (or docker-compose.prod.yml:docker-compose.media.yml; add the Keycloak file
# with another colon-separated entry if you use it).
#
# How it works: the host's media directory is bind-mounted read-only with rslave
# propagation, so drives the desktop mounts there show up inside the proxy
# container and in its /proc/self/mountinfo, which the gateway waits on without
# using CPU. /run/udev (read-only) supplies labels and UUIDs. Nothing is written
# to the drive, and nothing is made available until an administrator enables it.
#
# Set MLW_MEDIA_DIR in .env if your desktop mounts drives elsewhere, for example
# /run/media (Fedora, Arch). The host's / must be a shared mount (the systemd
# default); `findmnt -no PROPAGATION /` should print "shared".
services:
  proxy:
    environment:
      MEDIA_DIR: /host/media
      MEDIA_HOST_DIR: ${MLW_MEDIA_DIR:-/media}
      MEDIA_STATE_FILE: /var/lib/mlw-proxy/media.json
      # Testing aid: also report loop and other virtual devices (default: only physical drives).
      MEDIA_INCLUDE_VIRTUAL: ${MLW_MEDIA_INCLUDE_VIRTUAL:-false}
    volumes:
      - type: bind
        source: ${MLW_MEDIA_DIR:-/media}
        target: /host/media
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
      - proxy-state:/var/lib/mlw-proxy   # remembered decisions

volumes:
  proxy-state:
